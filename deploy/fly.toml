# fly launch --config deploy/fly.toml
# Then: fly volumes create cc_data --size 2
#        fly secrets set COURSECOPILOT_TOKEN=$(openssl rand -hex 16)
# https://fly.io/docs/reference/configuration/

app = "coursecopilot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  COURSECOPILOT_HOME = "/data"
  HF_HOME = "/data/hf"
  PORT = "8787"
  COURSECOPILOT_BIND = "0.0.0.0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options]
    [http_service.http_options.idle_timeout]
      duration = "120s"

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "cc_data"
  destination = "/data"
