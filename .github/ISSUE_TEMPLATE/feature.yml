name: Feature request
description: Propose a change that is not a pack takedown or an install bug
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should CourseCopilot do instead? Keep generation on the host AI (no LLM SDK in this repo).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingest (files, websites, YouTube, leccap)
        - Canvas
        - Search / citations
        - Quizzes / weak spots / planner
        - Packs / registry
        - Setup / doctor / clients
        - Remote / HTTP
        - Docs
        - Other
