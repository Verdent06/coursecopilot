name: Pack takedown
description: Ask us to remove a course pack (links/metadata only; no content is hosted)
labels: ["pack-takedown"]
title: "Takedown: packs/<id>.json"
body:
  - type: markdown
    attributes:
      value: |
        Packs contain **links and metadata only**. Each student downloads materials from the original source. If you are a rights holder and want a pack removed, we will delete `packs/<id>.json` and regenerate the index.
  - type: input
    id: pack_id
    attributes:
      label: Pack id
      placeholder: mit-6.045j-s11
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this pack should be removed
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: So we can confirm the request. Not published.
