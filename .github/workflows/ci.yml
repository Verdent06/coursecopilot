name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: windows-latest is VS 2026, which node-gyp cannot detect
        # if a native module has to compile. See docs/SPEC.md §22.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.node }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Lint
        run: npx biome check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: No LLM SDKs
        run: node scripts/check-no-llm-sdks.mjs

      - name: Build
        run: npm run build

      - name: Cursor install link
        run: npm run check:cursor-link

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Pack MCPB
        run: npm run pack:mcpb

      - name: Tools doc
        run: npm run docs:tools:check

      - name: Test
        run: npx vitest run
        env:
          COURSECOPILOT_HOME: ${{ runner.temp }}/coursecopilot-ci

  packs:
    name: Pack schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate packs
        run: npm run packs:validate

  pack-links:
    name: Pack URL check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check pack source URLs
        run: npm run packs:check-urls
