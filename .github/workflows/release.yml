# Publishes coursecopilot to npm with provenance, attaches coursecopilot.mcpb
# to the GitHub Release, and pushes the HTTP-server image to GHCR.
#
# Trigger: git tag v* (for example v0.1.0). Do not run this workflow from a
# PR. Secrets the human must set before the first tag:
#   NPM_TOKEN  — npm automation/granular token with publish rights on `coursecopilot`
# Optional:
#   RENDER_DEPLOY_HOOK — Render deploy-hook URL for a post-release smoke instance
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Lint, typecheck, no LLM SDKs
        run: |
          npx biome check .
          npx tsc --noEmit
          node scripts/check-no-llm-sdks.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run
        env:
          COURSECOPILOT_HOME: ${{ runner.temp }}/coursecopilot-release

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcpb:
    name: Attach MCPB to GitHub Release
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack coursecopilot.mcpb
        run: npm run pack:mcpb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: coursecopilot.mcpb
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/verdent06/coursecopilot" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-render:
    name: Optional Render smoke (needs RENDER_DEPLOY_HOOK)
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ vars.RENDER_SMOKE_URL != '' }}
    continue-on-error: true
    steps:
      - name: Ping MCP initialize on the smoke instance
        env:
          RENDER_SMOKE_URL: ${{ vars.RENDER_SMOKE_URL }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$RENDER_SMOKE_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"coursecopilot-release-smoke","version":"0.0.0"}}}' \
            | head -c 4000
